name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: shellcheck the run blocks
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/extract_shell.py action.yml .shellcheck
          shellcheck --shell=bash --external-sources .shellcheck/*.sh

      - name: yamllint
        run: |
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yml action.yml .github/workflows examples

      - name: action.yml against the metadata schema
        run: |
          python3 -m pip install --quiet check-jsonschema
          check-jsonschema --builtin-schema vendor.github-actions action.yml

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # pyyaml is what tests/test_action_yml.py reads action.yml with. Without
      # it that whole file importorskips away and the job passes having
      # checked nothing.
      - run: python -m pip install --upgrade pip pytest pyyaml

      - run: python -m pytest tests/ -q

      # Windows would otherwise run this block under pwsh, where the bash
      # below is not a script at all.
      - name: The action.yml suite really ran
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/action-yml.xml
        run: |
          set -euo pipefail

          # The JUnit report rather than `--collect-only` output: the shape of
          # that output has changed between pytest releases, and the install
          # above takes whatever is newest. Cases that were skipped do not
          # count, so the pyyaml importorskip at the top of the file shows up
          # as a failure here instead of as a job that checked nothing.
          python -m pytest tests/test_action_yml.py -q --junitxml="$REPORT"

          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(os.environ["REPORT"]).getroot().iter("testcase")
          ran = [c for c in cases if c.find("skipped") is None]
          print(f"{len(ran)} action.yml tests ran")
          if len(ran) <= 10:
              sys.exit("the action.yml suite did not run - is pyyaml installed?")
          PY
