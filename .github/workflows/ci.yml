name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: shellcheck the run blocks
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/extract_shell.py action.yml .shellcheck
          shellcheck --shell=bash --external-sources .shellcheck/*.sh

      - name: yamllint
        run: |
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yml action.yml .github/workflows examples

      - name: action.yml against the metadata schema
        run: |
          python3 -m pip install --quiet check-jsonschema
          check-jsonschema --builtin-schema vendor.github-actions action.yml

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install --upgrade pip pytest

      - run: python -m pytest tests/ -q
