name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: shellcheck the run blocks
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/extract_shell.py action.yml .shellcheck
          shellcheck --shell=bash --external-sources .shellcheck/*.sh

      - name: yamllint
        run: |
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yml action.yml .github/workflows examples

      - name: action.yml against the metadata schema
        run: |
          python3 -m pip install --quiet check-jsonschema
          check-jsonschema --builtin-schema vendor.github-actions action.yml

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # pyyaml is what tests/test_action_yml.py reads action.yml with. Without
      # it that whole file importorskips away and the job passes having
      # checked nothing.
      - run: python -m pip install --upgrade pip pytest pyyaml

      - run: python -m pytest tests/ -q

      - name: The action.yml suite really ran
        run: |
          set -euo pipefail
          python -m pytest tests/test_action_yml.py -q --collect-only >/dev/null
          test "$(python -m pytest tests/test_action_yml.py -q --collect-only 2>/dev/null | grep -c '::')" -gt 10
