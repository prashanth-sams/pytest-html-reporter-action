# The second half of fork-pr.yml. Save this as its own workflow file.
#
# `workflow_run` runs from your default branch with your permissions, and
# never checks out the fork's code. It only reads two text files.
name: tests comment

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytest-html-report-comment
          path: comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- pytest-html-reporter-action -->';
            const issue_number = Number(fs.readFileSync('comment/pr-number', 'utf8').trim());
            const body = marker + '\n' + fs.readFileSync('comment/body.md', 'utf8');

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed('the artifact did not carry a usable pull request number');
              return;
            }

            const existing = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const mine = existing.find((comment) => comment.body?.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
